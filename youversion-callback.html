<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Connecting YouVersion…</title>
</head>
<body>
  <p>Connecting your YouVersion account…</p>
  <script>
    (async () => {
      const params = new URLSearchParams(window.location.search);
      // Some providers return the auth response in the URL fragment instead
      // of the query string — check both so a real code isn't missed.
      const hashParams = new URLSearchParams(window.location.hash.replace(/^#/, ""));
      const code = params.get("code") || hashParams.get("code");
      const state = params.get("state") || hashParams.get("state");
      const error = params.get("error") || hashParams.get("error");
      const errorDescription = params.get("error_description") || hashParams.get("error_description");
      const expectedState = sessionStorage.getItem("yv_oauth_state");

      function fail(reason, detail) {
        sessionStorage.removeItem("yv_oauth_state");
        sessionStorage.removeItem("yv_pkce_verifier");
        sessionStorage.removeItem("yv_relayed_callback");
        const q = new URLSearchParams({ yvConnect: "error", reason });
        if (detail) q.set("detail", detail);
        window.location.href = "/?" + q.toString();
      }

      if (error) return fail("provider_error", errorDescription || error);

      // YouVersion's /authorize redirect lands here WITHOUT a `code` — only
      // `state` — because the real authorization code is minted by a second
      // hop through YouVersion's own /auth/callback endpoint (authenticated
      // via the session cookie set on their domain during login), which
      // then redirects back here again, this time with `code` present. See
      // developers.youversion.com/sign-in-apis. That endpoint needs to know
      // which app and which redirect target it's minting the code for, so
      // client_id and redirect_uri have to be passed explicitly — the
      // original landing here only ever carries `state`, nothing else to
      // forward. Relay once; if we land back here a second time still
      // without a code, that's a real failure.
      if (!code && state && !sessionStorage.getItem("yv_relayed_callback")) {
        if (state !== expectedState) return fail("state_mismatch");
        sessionStorage.setItem("yv_relayed_callback", "1");
        const relayParams = new URLSearchParams(params);
        relayParams.set("client_id", "Z8ou4eKH1jLzXHa8QOvlNnCgLQmXRtY2tyIfBg31o8omy0IO");
        relayParams.set("redirect_uri", window.location.origin + "/youversion-callback.html");
        window.location.href = "https://api.youversion.com/auth/callback?" + relayParams.toString();
        return;
      }

      const verifier = sessionStorage.getItem("yv_pkce_verifier");
      sessionStorage.removeItem("yv_oauth_state");
      sessionStorage.removeItem("yv_pkce_verifier");
      sessionStorage.removeItem("yv_relayed_callback");

      if (!code) return fail("missing_code", window.location.search + window.location.hash);
      if (!verifier) return fail("missing_verifier_lost_session");
      if (state !== expectedState) return fail("state_mismatch");

      try {
        const sitePassword = localStorage.getItem("bible-study:sitePassword") || "";
        const res = await fetch("/api/youversion/token", {
          method: "POST",
          headers: { "Content-Type": "application/json", "X-Site-Password": sitePassword },
          body: JSON.stringify({
            code,
            code_verifier: verifier,
            redirect_uri: window.location.origin + "/youversion-callback.html",
          }),
        });
        if (res.ok) {
          window.location.href = "/?yvConnect=success";
        } else {
          const text = await res.text().catch(() => "");
          fail("token_exchange_failed", text.slice(0, 300));
        }
      } catch (err) {
        fail("fetch_error", String(err && err.message));
      }
    })();
  </script>
</body>
</html>
