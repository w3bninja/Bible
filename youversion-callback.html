<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Connecting YouVersion…</title>
</head>
<body>
  <p>Connecting your YouVersion account…</p>
  <script>
    (async () => {
      const params = new URLSearchParams(window.location.search);
      const code = params.get("code");
      const state = params.get("state");
      const error = params.get("error");
      const errorDescription = params.get("error_description");
      const expectedState = sessionStorage.getItem("yv_oauth_state");
      const verifier = sessionStorage.getItem("yv_pkce_verifier");
      sessionStorage.removeItem("yv_oauth_state");
      sessionStorage.removeItem("yv_pkce_verifier");

      function fail(reason, detail) {
        const q = new URLSearchParams({ yvConnect: "error", reason });
        if (detail) q.set("detail", detail);
        window.location.href = "/?" + q.toString();
      }

      if (error) return fail("provider_error", errorDescription || error);
      if (!code) return fail("missing_code");
      if (!verifier) return fail("missing_verifier_lost_session");
      if (state !== expectedState) return fail("state_mismatch");

      try {
        const res = await fetch("/api/youversion/token", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            code,
            code_verifier: verifier,
            redirect_uri: window.location.origin + "/youversion-callback.html",
          }),
        });
        if (res.ok) {
          window.location.href = "/?yvConnect=success";
        } else {
          const text = await res.text().catch(() => "");
          fail("token_exchange_failed", text.slice(0, 300));
        }
      } catch (err) {
        fail("fetch_error", String(err && err.message));
      }
    })();
  </script>
</body>
</html>
