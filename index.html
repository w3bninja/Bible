<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Anchor</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <nav class="sidebar">
      <div class="sidebar-title">
        <span class="title-full">Anchor</span>
        <span class="title-mark">A</span>
      </div>
      <button class="nav-item active" data-view="read" title="Read">
        <svg viewBox="0 0 20 20" fill="none"><path d="M2 4.5C2 3.7 2.7 3 3.5 3H9v14H3.5c-.8 0-1.5-.7-1.5-1.5v-11ZM18 4.5c0-.8-.7-1.5-1.5-1.5H11v14h5.5c.8 0 1.5-.7 1.5-1.5v-11Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
        <span>Read</span>
      </button>
      <button class="nav-item" data-view="tags" title="Tags">
        <svg viewBox="0 0 20 20" fill="none"><path d="M10.6 2.5H4.8a1 1 0 0 0-1 1v5.8c0 .27.1.52.3.7l7 7c.4.4 1 .4 1.4 0l5.8-5.8c.4-.4.4-1 0-1.4l-7-7a1 1 0 0 0-.7-.3Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><circle cx="6.8" cy="6.8" r="1" fill="currentColor"/></svg>
        <span>Tags</span>
      </button>
      <button class="nav-item" data-view="topics" title="Topics">
        <svg viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="7.5" stroke="currentColor" stroke-width="1.3"/><path d="M10 6v4l2.5 2.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Topics</span>
      </button>
    </nav>

    <main class="main">
      <div class="top-bar">
        <div class="top-bar-left">
          <button id="collapseBtn" class="icon-btn-outline" title="Toggle sidebar">
            <svg viewBox="0 0 20 20" fill="none"><rect x="2" y="3" width="7" height="14" rx="1.5" stroke="currentColor" stroke-width="1.6"/><rect x="11" y="3" width="7" height="14" rx="1.5" stroke="currentColor" stroke-width="1.6"/></svg>
          </button>
          <button id="backBtn" class="icon-btn-outline hidden" title="Back">
            <svg viewBox="0 0 20 20" fill="none"><path d="M12 4l-6 6 6 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <span id="breadcrumb">Reading</span>
        </div>
        <button id="searchToggleBtn" class="icon-btn" title="Search">
          <svg viewBox="0 0 20 20" fill="none"><circle cx="9" cy="9" r="6" stroke="currentColor" stroke-width="1.4"/><path d="M17 17l-3.5-3.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        </button>
      </div>

      <div id="readView" class="view-content">
        <div class="chapter-nav-float">
          <button id="prevChapterBtn" class="nav-arrow-btn nav-arrow-prev" title="Previous chapter" aria-label="Previous chapter">‹</button>
          <button id="nextChapterBtn" class="nav-arrow-btn nav-arrow-next" title="Next chapter" aria-label="Next chapter">›</button>
        </div>
        <div class="chapter-title-row">
          <button id="chapterPickerBtn" class="chapter-title-btn">
            <h1 id="chapterHeading">Genesis 1</h1>
            <span class="caret">▾</span>
          </button>
        </div>
        <div class="version-label">King James Version</div>
        <div id="verses" class="chapter-flow"></div>
      </div>

      <div id="verseView" class="view-content hidden">
        <button type="button" class="verse-detail-ref" id="verseDetailRef" title="View in chapter"></button>
        <div class="verse-detail-text" id="verseDetailText"></div>
        <div class="verse-detail-tags" id="verseDetailTags"></div>
        <div class="notes-label-row">
          <div class="notes-label">MY NOTES</div>
          <button type="button" id="verseDetailNoteClear" class="note-clear-btn hidden">Delete note</button>
        </div>
        <textarea id="verseDetailNotes" placeholder="Write what this verse means to you…"></textarea>
      </div>

      <div id="tagsView" class="view-content hidden">
        <div class="tags-page-header">
          <h1 class="page-heading">Tags</h1>
          <button type="button" id="newTagPageBtn" class="btn btn-accent-solid btn-small">+ New Tag</button>
        </div>
        <div id="tagFilterBar" class="tag-filter-bar"></div>
        <div id="tagVerseList" class="verse-card-list"></div>
      </div>

      <div id="topicsView" class="view-content hidden">
        <div class="tags-page-header">
          <h1 class="page-heading">Topics</h1>
          <button type="button" id="newAutoTagBtn" class="btn btn-accent-solid btn-small">+ New Auto-Tag</button>
        </div>

        <div class="tags-subnav">
          <button type="button" class="subnav-tab active" data-topictab="mine">Your Auto-Tags</button>
          <button type="button" class="subnav-tab" data-topictab="browse">Browse Topics</button>
        </div>

        <div id="myAutoTagsTab">
          <div id="autoTagsList" class="smart-tags-list"></div>
        </div>

        <div id="browseTopicsTab" class="hidden">
          <input id="topicsSearchInput" type="search" class="search-input" placeholder="Search topics…" />
          <div id="topicCategoryFilterBar" class="tag-filter-bar"></div>
          <div id="topicsBrowseList" class="topics-browse-list"></div>
        </div>
      </div>

      <div id="searchView" class="view-content hidden">
        <input id="searchInput" type="search" class="search-input" placeholder="Search verses or tags…" />
        <div id="searchEmptyHint" class="search-hint">Try &ldquo;peace&rdquo;, &ldquo;comfort&rdquo;, or a reference like John 3:16.</div>
        <h1 class="page-heading hidden" id="searchHeading">Search results</h1>
        <div id="searchToolbar" class="search-toolbar hidden">
          <div id="searchFilterBar" class="tag-filter-bar"></div>
          <button id="searchSelectAllBtn" type="button" class="btn btn-outline btn-small">Select all</button>
        </div>
        <div id="searchResults" class="verse-card-list"></div>
      </div>

    </main>
  </div>

  <div id="pickerOverlay" class="modal-overlay hidden">
    <div class="modal picker-modal">
      <div class="picker-modal-header">
        <button id="pickerBackBtn" class="icon-btn-outline hidden" title="Back">
          <svg viewBox="0 0 20 20" fill="none"><path d="M12 4l-6 6 6 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="picker-modal-title" id="pickerModalTitle">Select a book</div>
        <button id="pickerCloseBtn" class="icon-btn-outline" title="Close">
          <svg viewBox="0 0 20 20" fill="none"><path d="M5 5l10 10M15 5L5 15" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
      </div>
      <input id="pickerSearchInput" type="search" class="picker-search-input" placeholder="Search books…" />
      <div id="pickerBookList" class="picker-book-list"></div>
      <div id="pickerChapterGrid" class="picker-chapter-grid hidden"></div>
    </div>
  </div>

  <div id="selectionBar" class="selection-bar hidden">
    <span id="selectionCount"></span>
    <div class="selection-actions">
      <button id="studyWordsBtn" type="button" class="btn btn-outline btn-small hidden">Study words…</button>
      <button id="tagSelectionBtn" type="button" class="btn btn-accent-solid btn-small">Tag &amp; note selected…</button>
      <button id="clearSelectionBtn" type="button" class="btn btn-outline btn-small">Clear</button>
    </div>
  </div>

  <div id="wordStudyPanel" class="word-study-panel hidden">
    <div class="word-study-header">
      <div class="word-study-ref" id="wordStudyRef"></div>
      <button id="wordStudyCloseBtn" class="icon-btn-outline" title="Close">
        <svg viewBox="0 0 20 20" fill="none"><path d="M5 5l10 10M15 5L5 15" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div id="wordStudyLoading" class="word-study-loading hidden">Loading word data…</div>
    <div id="wordStudyChips" class="word-study-chips"></div>
    <div id="wordStudyDetail" class="word-study-detail hidden">
      <button id="wordStudyBackBtn" class="word-study-back-btn">‹ All words</button>
      <div class="word-study-card" id="wordStudyCard"></div>
    </div>
  </div>

  <div id="tagAssignOverlay" class="modal-overlay hidden">
    <div class="modal tag-assign-modal">
      <div class="modal-ref" id="tagAssignRef"></div>
      <div id="tagAssignList" class="tag-assign-list"></div>
      <label class="note-label hidden" id="tagAssignNoteLabel">
        <span class="notes-label-row">Note
          <button type="button" id="tagAssignNoteClear" class="note-clear-btn hidden">Delete note</button>
        </span>
        <textarea id="tagAssignNote" rows="3" placeholder="Add a note to the selected verse(s)…"></textarea>
      </label>
      <div class="modal-actions">
        <button id="tagAssignAddBtn" type="button" class="btn btn-accent-solid">+ Add</button>
        <button id="tagAssignDoneBtn" type="button" class="btn btn-outline">Done</button>
      </div>
    </div>
  </div>

  <div id="newTagOverlay" class="modal-overlay hidden">
    <div class="modal">
      <h2 id="newTagModalTitle">New Tag</h2>
      <form id="newTagForm">
        <label>Name
          <input type="text" id="newTagName" required maxlength="30" placeholder="e.g. Faith" />
        </label>
        <label id="newTagStrongsRow">Auto-tag by Strong's number (optional)
          <input type="text" id="newTagStrongs" maxlength="10" placeholder="e.g. G26" />
        </label>
        <label id="newTagTopicRow">Auto-tag by topic (optional)
          <input type="text" id="newTagTopic" list="topicsDatalist" placeholder="e.g. Parables of Jesus, Faith, Love" />
          <datalist id="topicsDatalist"></datalist>
        </label>
        <label id="newTagPersonRow">Auto-tag by person (optional)
          <input type="text" id="newTagPerson" list="personsDatalist" placeholder="e.g. David, Paul, Mary (sister of Martha)" />
          <datalist id="personsDatalist"></datalist>
        </label>
        <div class="hue-swatches" id="hueSwatches"></div>
        <div class="modal-actions">
          <button type="button" id="newTagCancel" class="btn btn-outline">Cancel</button>
          <button type="submit" class="btn btn-accent-solid" id="newTagSubmitBtn">Create</button>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
