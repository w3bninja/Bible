[build]
  command = "npm install"
  publish = "."

[functions]
  directory = "netlify/functions"

# Pulls the user operations App Manager has queued for this app. Scheduled rather than exposed
# as an endpoint: nothing needs a deletion to land within seconds, and a schedule means the
# dashboard holds no way to make this app act on demand.
[functions."collect-app-manager-tasks"]
  schedule = "*/5 * * * *"

[[redirects]]
  from = "/api/tags"
  to = "/.netlify/functions/tags"
  status = 200
  force = true

[[redirects]]
  from = "/api/prefs"
  to = "/.netlify/functions/prefs"
  status = 200
  force = true

[[redirects]]
  from = "/api/youversion/token"
  to = "/.netlify/functions/youversion-token"
  status = 200
  force = true

[[redirects]]
  from = "/api/youversion/status"
  to = "/.netlify/functions/youversion-status"
  status = 200
  force = true

[[redirects]]
  from = "/api/youversion/highlights"
  to = "/.netlify/functions/youversion-highlights"
  status = 200
  force = true

[[redirects]]
  from = "/api/shares"
