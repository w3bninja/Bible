[build]
  command = "npm install"
  publish = "."

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/tags"
  to = "/.netlify/functions/tags"
  status = 200
  force = true

[[redirects]]
  from = "/api/youversion/token"
  to = "/.netlify/functions/youversion-token"
  status = 200
  force = true

[[redirects]]
  from = "/api/youversion/status"
  to = "/.netlify/functions/youversion-status"
  status = 200
  force = true

[[redirects]]
  from = "/api/shares"
  to = "/.netlify/functions/shares"
  status = 200
  force = true

[[redirects]]
  from = "/api/categories"
  to = "/.netlify/functions/categories"
  status = 200
  force = true

[[redirects]]
  from = "/api/share-view"
  to = "/.netlify/functions/share-view"
  status = 200
  force = true
